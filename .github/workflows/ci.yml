name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/secret-vault
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ci_test
      SPRING_DATASOURCE_USERNAME: ci_test
      SPRING_DATASOURCE_PASSWORD: ci_test
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ci_test_secret_key
      JWT_EXPIRATION: 86400000
      ENCRYPTION_KEY: ci_test_key_1234
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: ./mvnw clean verify

  validate-shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  validate-docker-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy .env for validation
        run: |
          cat > .env << 'ENVEOF'
          POSTGRES_USER=ci_dummy
          POSTGRES_PASSWORD=ci_dummy
          POSTGRES_DB=ci_dummy
          JWT_SECRET=ci_dummy_secret
          JWT_EXPIRATION=86400000
          ENCRYPTION_KEY=ci_dummy_key_1234
          ENVEOF

      - name: Validate docker-compose.yml
        run: docker compose config
