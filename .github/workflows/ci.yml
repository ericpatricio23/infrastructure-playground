name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/secret-vault
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: ./mvnw clean verify

  validate-shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  validate-docker-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy .env for validation
        run: |
          cat > .env << 'ENVEOF'
          POSTGRES_USER=ci_dummy
          POSTGRES_PASSWORD=ci_dummy
          POSTGRES_DB=ci_dummy
          JWT_SECRET=ci_dummy_secret
          JWT_EXPIRATION=86400000
          ENCRYPTION_KEY=ci_dummy_key_1234
          ENVEOF

      - name: Validate docker-compose.yml
        run: docker compose config
