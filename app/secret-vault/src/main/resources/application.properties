# Aplicacao
spring.application.name=secret-vault

# PostgreSQL (fallback para localhost, usado só quando roda fora do Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/playgrounddb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:playground}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:playground123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Porta da aplicacao
server.port=8081

# JWT
jwt.secret=${JWT_SECRET:changeme-local-dev-only}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Criptografia AES
encryption.key=${ENCRYPTION_KEY:changeme1234567}

# Actuator - health check para o Docker Compose
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true
